<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; }
    </style>
  </defs>
  <rect width="640" height="160" fill="#0e0f0e"/>

  <!-- icon, scaled/translated version of icon.svg core marks, no background box -->
  <g transform="translate(20, 20) scale(0.6)">
    <g fill="none" stroke="#b8f04a" stroke-linecap="round">
      <path d="M 100 60 A 40 40 0 0 1 138 108" stroke-width="9" opacity="0.35"/>
      <path d="M 100 40 A 60 60 0 0 1 156 118" stroke-width="9" opacity="0.6"/>
      <path d="M 100 20 A 80 80 0 0 1 174 128" stroke-width="9" opacity="1"/>
    </g>
    <circle cx="100" cy="100" r="12" fill="#f5f5f0"/>
    <circle cx="174" cy="128" r="11" fill="#b8f04a"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="98" class="wordmark" font-size="46" font-weight="700" letter-spacing="0" fill="#f5f5f0">bot<tspan fill="#b8f04a">centrum</tspan></text>
</svg>
