<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="28" fill="#0e0f0e"/>
  <!-- three scan arcs at increasing radii, each a partial sweep -->
  <g fill="none" stroke="#b8f04a" stroke-linecap="round">
    <path d="M 100 60 A 40 40 0 0 1 138 108" stroke-width="7" opacity="0.35"/>
    <path d="M 100 40 A 60 60 0 0 1 156 118" stroke-width="7" opacity="0.6"/>
    <path d="M 100 20 A 80 80 0 0 1 174 128" stroke-width="7" opacity="1"/>
  </g>
  <!-- core: the observer -->
  <circle cx="100" cy="100" r="10" fill="#f5f5f0"/>
  <!-- detected point sitting on the outer arc -->
  <circle cx="174" cy="128" r="9" fill="#b8f04a"/>
</svg>
