<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; }
      .tagline { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; }
    </style>
    <radialGradient id="glow" cx="78%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#b8f04a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b8f04a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e0f0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid, evokes structured data / observation instruments -->
  <g stroke="#f5f5f0" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- large scan mark, off to the right, partially bleeding off-canvas -->
  <g transform="translate(760, 55) scale(2.05)">
    <g fill="none" stroke="#b8f04a" stroke-linecap="round">
      <path d="M 100 60 A 40 40 0 0 1 138 108" stroke-width="6" opacity="0.3"/>
      <path d="M 100 40 A 60 60 0 0 1 156 118" stroke-width="6" opacity="0.55"/>
      <path d="M 100 20 A 80 80 0 0 1 174 128" stroke-width="6" opacity="1"/>
    </g>
    <circle cx="100" cy="100" r="8" fill="#f5f5f0"/>
    <circle cx="174" cy="128" r="7.5" fill="#b8f04a"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="330" class="wordmark" font-size="56" font-weight="700" fill="#f5f5f0">bot<tspan fill="#b8f04a">centrum</tspan></text>

  <!-- tagline -->
  <text x="90" y="390" class="tagline" font-size="26" fill="#f5f5f0" opacity="0.75">Tools for the Agent Economy</text>

  <!-- sub-line: what the site actually does, in its own editorial voice -->
  <text x="90" y="460" class="tagline" font-size="19" fill="#f5f5f0" opacity="0.45">Real-time data sources for AI agents — compared on onboarding, not hype.</text>

  <!-- footer strip -->
  <text x="90" y="560" class="tagline" font-size="16" fill="#b8f04a" opacity="0.8">botcentrum.com</text>
  <text x="1110" y="560" class="tagline" font-size="16" fill="#f5f5f0" opacity="0.4" text-anchor="end">Independently curated</text>
</svg>
